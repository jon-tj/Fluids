@if (solver()) {
  <h1>{{ solver()!.displayName }}</h1>
  @for (line of descriptionLines; track line) {
    <p>{{ line }}</p>
  }
  <section class="flex-row">
    <aside class="param-container">
      @for (param of parameters(); track param.key) {
        <app-parameter-field [parameter]="param.data" [title]="param.key"></app-parameter-field>
      }
    </aside>
    <aside>
      <app-solver-simulation
        [solver]="solver()!.id"
        (stateChange)="this.state.set($event)"
      ></app-solver-simulation>
      <section class="handles">
        <button (click)="btnResetParams()">Reset Parameters</button>
        <button (click)="btnResetState()">Reset State</button>
      </section>
    </aside>
  </section>
}

<h3>Gauges</h3>
<app-particle-gauges-list [state]="state()"></app-particle-gauges-list>
